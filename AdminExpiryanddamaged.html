<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
       <link rel="stylesheet" href="style/style.css">

    <title>Expiry and damaged</title>
</head>
<body>
    
    <h1>MediShop Admin</h1>
    <p>Admin panel</p>
    
    <div>
        <a href="Admindeshboard.html">Dashboard</a>
        <a href="AdminMedicines.html">Medicines</a>
        <a href="AdminCategories.html">Categories</a>
        <a href="AdminOrders.html">Orders</a>
        <a href="AdminReview.html">Reviews</a>
        <a href="AdminCustomer.html">Customers</a>
        <a href="AdminPharmacist.html">Pharmacist</a>
        <a href="AdminExpiryanddamaged.html">Expiry & Damaged</a>
        <a href="#" class="logout">Logout</a>
    </div>
    
    
    <fieldset>
        <legend>
            <h2>Expiry and damaged</h2>
        </legend>
        <p>Keep stock safe</p>
        
        
        <table width="100%">
            <tr>
            <td valign="top" width="50%">
                <fieldset>
                    <legend><h3>Expiring in 60 days</h3></legend>
                <table border="1" width="100%">
                    <tr>
                    <th>MEDICINE</th>
                    <th>EXPIRY</th>
                    <th>QTY</th>
                    <th>ACTION</th>
                    </tr>

                    <tr align="center">
                    <td>Vitamin C</td>
                    <td>Dec 2026</td>
                    <td>60</td>
                    <td>
                        <input type="button" value="Mark damaged">
                    </td>
                    </tr>


                    <tr align="center">
                    <td>Cough syrup</td>
                    <td>Jan 2027</td>
                    <td>14</td>
                    <td>
                        <input type="button" value="Mark damaged">
                    </td>
                    </tr>
                </table>
                </fieldset>
            </td>
                
                <td valign="top" width="50%">
                <fieldset>
                    <legend><h3>Report damaged stock</h3></legend>
                    <form>
                        <table width="100%">
                            <tr>
                            <td>
                                <label>Medicine</label><br>
                                <select>
                                    <option>Napa 500mg</option>
                                </select>
                            </td>
                            <td>
                                <label>Quantity</label><br>
                                <input type="text" size="15">
                            </td>
                            </tr>
                            <tr>
                            <td colspan="2">
                               <br>
                                <label>Reason</label><br>
                                <textarea rows="4" cols="50"></textarea>
                            </td>
                            </tr>
                            <tr>
                            <td>
                                 <br>
                                 <input type="button" value="Save report">
                            </td>
                            </tr>
                        </table>
                    </form>
                </fieldset>
                </td>
            </tr>
        </table>
    </fieldset>
    <script src="js/script.js"></script>
</body>
</html>
