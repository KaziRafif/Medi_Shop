<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style/style.css">

    <title>Orders</title>
</head>
<body>
    
    <h1>MediShop Admin</h1>
    
    
    <div>
        <a href="Admindeshboard.html">Dashboard</a>
        <a href="Medicines.html">Medicines</a>
        <a href="Categories.html">Categories</a>
        <a href="Orders.html">Orders</a>
        <a href="Review.html">Reviews</a>
        <a href="Customer.html">Customers</a>
        <a href="Pharmacist.html">Pharmacist</a>
        <a href="Expiryanddamaged.html">Expiry & Damaged</a>
        <a href="#" class="logout">Logout</a>
    </div>
    
    
    <fieldset>
        <legend>
            <h2>Orders</h2>
        </legend>
        <p>Track delivery and pickup</p>
        
        <form>
            <input type="text" placeholder="Search order or customer" size="30">
            <select>
                <option>All status</option>
                <option>Pending</option>
                <option>On the Way</option>
                <option>Delivered</option>
            </select>
        </form>
        
        
        <table border="1" width="100%">
            <tr>
                <th>ID</th>
                <th>CUSTOMER</th>
                <th>TYPE</th>
                <th>TOTAL</th>
                <th>RIDER</th>
                <th>STATUS</th>
                <th>ACTION</th>
            </tr>
            <tr align="center">
                <td>11</td>
                <td>Rafi</td>
                <td>Home delivery</td>
                <td>340 tk</td>
                <td>
                    <select>
                        <option>Raju</option>
                        <option>Ratul</option>
                        <option>Rahul</option>

                    </select>
                </td>
                <td>
                    <select>
                        <option>Pending</option>
                        <option>On the Way</option>
                        <option>Delivered</option>
                    </select>
                </td>
                <td>
                    <input type="button" value="Update">
                </td>
            </tr>
            <tr align="center">
                <td>12</td>
                <td>Sifa</td>
                <td>Pickup</td>
                <td>85 tk</td>
                <td>Not needed</td>
                <td>
                    <select>
                        <option>Ready</option>
                        <option>Pending</option>
                    </select>
                </td>
                <td>
                    <input type="button" value="Update">
                </td>
            </tr>
            <tr align="center">
                <td>13</td>
                <td>Siyam</td>
                <td>Home delivery</td>
                <td>120 tk</td>
                <td>
                    <select>
                        <option>Raju</option>
                        <option>Ratul</option>
                        <option>Rahul</option>
                    </select>
                </td>
                <td>
                    <select>
                        <option>Pending</option>
                        <option>Ready</option>
                    </select>
                </td>
                <td>
                    <input type="button" value="Update">
                </td>
            </tr>
        </table>
    </fieldset>

</body>
</html>
