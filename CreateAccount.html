<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
        <link rel="stylesheet" href="style/style.css">

    
    <title>Create Account</title>
</head>
<body class="account">

    <h1>Create Account</h1>
    <p>Sign up as a Admin, Pharmacist, Customer</p>
    
    
        <form>
        <fieldset>
            <legend>
                <h3>Registration Details</h3>
            </legend>
            <br>
            
            <label for="reg">I am registering as</label>
            <br>
            <select name="reg" id="reg">
                <option value="Admin">Admin</option>
                <option value="Pharmacist">Pharmacist</option>
                <option value="Customer">Customer</option>
            </select>
            <br>
            <br>

            <label for="fullname">Full Name</label>
            <br>
            <input type="text" name="fullname" id="fullname" placeholder="kazirafi">
            <br>
            <br>

            <label for="email">Email Address</label>
            <br>
            <input type="text" name="email" id="email" placeholder="kazirafi@gmail.com">
            <br>
            <br>

            <label for="phone">Phone Number</label>
            <br>
            <input type="text" name="phone" id="phone" placeholder="+880xxxxxxxxxx">
            <br>
            <br>

            <label for="address">Address</label>
            <br>
            <input type="text" name="address" id="address" placeholder="Your city / area">
            <br>
            <br>

            <label for="password">Password</label>
            <br>
            <input type="password" name="password" id="password" placeholder="password">
            <br>
            <br>

            <label for="confirm">Confirm</label>
            <br>
            <input type="password" name="confirm" id="confirm" placeholder="confirm password">
            <br>
            <br>

            <input type="submit" value="Create Account">
            <br>
            <br>
            
            <span>Already have an account?</span>
             <a href="Login.html">Sign in</a>
            <br>

        </fieldset>
    </form>

</body>
</html>
