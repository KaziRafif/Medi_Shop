<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style/style.css">

    <title>Login</title>
</head>
<body class="account">

    <h1>MediShop Login</h1>
    <p>Sign in as Admin, Pharmacist or Customer</p>

    <form action="Admindeshboard.html">
        <fieldset>
            <legend>
                <h3>Login Details</h3>
            </legend>
            <br>

            <label for="log">I am logging in as</label>
            <br>
            <select name="log" id="log">
                <option value="Admin">Admin</option>
                <option value="Pharmacist">Pharmacist</option>
                <option value="Customer">Customer</option>
            </select>
            <br>
            <br>

            <label for="email">Email Address</label>
            <br>
            <input type="text" name="email" id="email" placeholder="kazirafi@gmail.com">
            <br>
            <br>

            <label for="password">Password</label>
            <br>
            <input type="password" name="password" id="password" placeholder="password">
            <br>
            <br>

            <input type="submit" value="Login">
            <br>
            <br>

            
            <span>Don't have an account?</span>
            <a href="AdminCreateAccount.html">Create account</a>
            <br>

        </fieldset>
    </form>
    <script src="js/script.js"></script>
</body>
</html>
